name: mpst
version: 0.1.0.0
synopsis: Multiparty session types experiments
category: Concurrency
license: BSD-3-Clause
author: Kai Pischke
maintainer: Kai Pischke
extra-source-files:
  - README.md

dependencies:
  - base >= 4.14 && < 5
  - containers
  - megaparsec
  - prettyprinter
  - transformers
  - mtl
  - array
  - graphviz
  - text
  - process
  - temporary

library:
  source-dirs: src
  exposed-modules:
    - MPST
    - Syntax
    - Automata
    - Balanced
    - DeadlockFreedom
    - Merge
    - MpstkBackend
    - Project
    - Safety
    - Subtyping
    - Synthesise
    - Liveness
    - Visualise
  other-modules:
    - Syntax.AST
    - Syntax.AlphaEq
    - Syntax.Parser
    - Syntax.Pretty
    - Syntax.WellFormed

executables:
  mpst-app:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - mpst

tests:
  mpst-test:
    main: Spec.hs
    source-dirs: test
    other-modules:
      - AutomataReconstructionSpec
      - BalancedSpec
      - ContextRandomSpec
      - DeadlockFreedomSpec
      - Fig4VennSpec
      - LessIsMoreSpec
      - MergeSpec
      - MpstkBackendSpec
      - ProjectionSpec
      - SafetySpec
      - SubtypingSpec
      - SynthesiseSpec
      - LivenessSpec
      - RoundtripSpec
      - TestGenerators
      - WellFormedSpec
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - mpst
      - QuickCheck
      - hspec
